name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Derle
        # GitHub Pages alt dizinde servis ediyor: /<repo>/
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npx vite build
        # Vite bu degiskenleri DERLEME ANINDA pakete gomuyor. Tanimli
        # degillerse uygulama kendi kuralina uyup olcumu sessizce kapatiyor:
        # site cikar, calisir, kimse fark etmez ve tek bir D1/D7 kaydi gelmez.
        # `anon` anahtari gizli degil (pakette zaten gorunur olacak); burada
        # secret olmasinin sebebi catallayanin bizim projemize olcum
        # gondermemesi.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
